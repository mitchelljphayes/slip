name: CI

on:
  push:
    branches: [main]
  # Run on all pull requests regardless of base branch so stacked PRs
  # (whose base is another feature branch, not main) still get CI.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# The Rust version is set in rust-toolchain.toml, not here. The runners ship
# rustup, and the first cargo call installs the pinned toolchain along with the
# components that file declares (rustfmt, clippy). Each job invokes
# `cargo --version` up front so the resolved version is visible in the log
# rather than buried in the first real step.
#
# To change the Rust version, edit rust-toolchain.toml. Editing this file will
# not do it: rustup applies the toolchain file as an override, so anything
# installed here is ignored.

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: cargo --version && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: cargo --version && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: cargo --version && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: cargo --version && rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  installer:
    name: Installer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh syntax check
        run: bash -n install.sh
      - name: Installer regression tests
        run: bash scripts/install-test.sh

  caddy-contract:
    name: Caddy Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: cargo --version && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Install Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy
      - name: Prepare Caddy for tests
        run: |
          # The apt package starts a caddy systemd service that holds :80/:443.
          # Stop it so the test-spawned Caddy can bind those ports.
          sudo systemctl stop caddy || true
          # Allow the unprivileged test process to bind privileged ports.
          sudo setcap 'cap_net_bind_service=+ep' "$(command -v caddy)"
      - run: cargo test -p slip-core --test caddy_contract -- --ignored --test-threads=1

  e2e:
    name: End-to-End Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: cargo --version && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Install Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install -y caddy
      - name: Prepare Caddy for tests
        run: |
          # The apt package starts a caddy systemd service that holds :80/:443.
          # Stop it so the test-spawned Caddy can bind those ports.
          sudo systemctl stop caddy || true
          # Allow the unprivileged test process to bind privileged ports.
          sudo setcap 'cap_net_bind_service=+ep' "$(command -v caddy)"
      - name: Start Caddy
        run: |
          caddy run --config <(echo '{"admin":{"listen":"127.0.0.1:2019"}}') &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:2019/config/ >/dev/null 2>&1; then
              echo "Caddy is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Caddy did not start within 30s"
              exit 1
            fi
            sleep 1
          done
      - run: cargo build --release --bin slipd
      - name: Run smoke test
        run: SLIP_BIN=./target/release/slipd ./scripts/smoke-test.sh
        env:
          SLIP_SECRET: test-secret

  service-security:
    name: Service Security Tests (Linux root)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: cargo --version && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Build slip-core lib test binary (as non-root runner)
        run: |
          # Compile the test binary as the non-root runner (uid 1000).
          # cargo is never run as root. Capture the exact binary path
          # from Cargo's JSON output for deterministic discovery.
          cargo test -p slip-core --lib --no-run --message-format json \
            > /tmp/cargo-test-json.txt 2>&1 || {
              cat /tmp/cargo-test-json.txt
              exit 1
            }
          # Extract the test binary path from the JSON output. The
          # "test-binary" artifact has the executable path.
          TEST_BIN=$(grep -o '"executable":"[^"]*"' /tmp/cargo-test-json.txt \
            | head -1 | sed 's/"executable":"//;s/"//')
          if [ -z "$TEST_BIN" ]; then
            echo "ERROR: could not extract test binary from cargo JSON"
            cat /tmp/cargo-test-json.txt | head -20
            exit 1
          fi
          echo "Test binary: $TEST_BIN"
          echo "TEST_BIN=$TEST_BIN" >> "$GITHUB_ENV"
      - name: Run Linux storage and secret security tests as root
        run: |
          # The GitHub Actions runner is non-root (uid 1000) on
          # ubuntu-latest. We execute the test binary via sudo so the
          # root-gated tests (openat2, UID 0 checks) can run.
          # The root assertion is inside each test (skip_if_nonroot).
          #
          # We run two separate filter groups:
          # 1. Linux-specific storage+secret tests (require root + openat2).
          # 2. Portable tests (image_ref, secret portable).
          #
          # The Linux-specific group must have a non-zero passed count
          # to prevent a false green from portables alone.

          # Group 1: Linux-specific tests (nested in _linux module).
          # Use conditional capture so bash -e does not abort before we
          # can print output and assert the passed-test count.
          LINUX_EXIT=0
          sudo env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            RUST_BACKTRACE=1 \
            "$TEST_BIN" --test-threads=1 \
            'services::storage::_linux::tests::' \
            'services::secret::_linux::tests::' \
            > /tmp/linux-tests.txt 2>&1 || LINUX_EXIT=$?
          cat /tmp/linux-tests.txt
          # Preserve the original cargo/test-binary exit code: if nonzero,
          # exit immediately with that status rather than falling through
          # to the zero-tests guard (which would overwrite 101 with 1).
          if [ "$LINUX_EXIT" -ne 0 ]; then
            echo "ERROR: Linux-specific test binary exited $LINUX_EXIT - see output above"
            exit "$LINUX_EXIT"
          fi
          LINUX_PASSED=$(grep -oP 'test result: ok\. \K\d+' /tmp/linux-tests.txt | tail -1 || true)
          if [ -z "$LINUX_PASSED" ] || [ "$LINUX_PASSED" -eq 0 ]; then
            echo "ERROR: 0 Linux-specific tests passed."
            echo "The _linux::tests:: filters may not match any tests."
            echo "This means the security-critical tests did not run."
            exit 1
          fi
          echo "Linux-specific tests passed: $LINUX_PASSED"
          # Assert a minimum expected count. The exact count may grow
          # but must be at least 20 (storage 20 + secret 30+).
          if [ "$LINUX_PASSED" -lt 20 ]; then
            echo "ERROR: only $LINUX_PASSED Linux tests passed (expected >= 20)."
            exit 1
          fi

          # Group 2: Portable tests (image_ref + secret portable).
          PORTABLE_EXIT=0
          sudo env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            RUST_BACKTRACE=1 \
            "$TEST_BIN" --test-threads=1 \
            'services::image_ref::tests::' \
            'services::secret::portable_tests::' \
            > /tmp/portable-tests.txt 2>&1 || PORTABLE_EXIT=$?
          cat /tmp/portable-tests.txt
          if [ "$PORTABLE_EXIT" -ne 0 ]; then
            echo "ERROR: portable test binary exited $PORTABLE_EXIT - see output above"
            exit "$PORTABLE_EXIT"
          fi
          PORTABLE_PASSED=$(grep -oP 'test result: ok\. \K\d+' /tmp/portable-tests.txt | tail -1 || true)
          if [ -z "$PORTABLE_PASSED" ] || [ "$PORTABLE_PASSED" -eq 0 ]; then
            echo "ERROR: 0 portable tests passed."
            exit 1
          fi
          echo "Portable tests passed: $PORTABLE_PASSED"
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/slip-test /tmp/slip-service-test /tmp/cargo-test-json.txt /tmp/test-output.txt /tmp/linux-tests.txt /tmp/portable-tests.txt

  services-contract:
    name: Services Contract Tests (rootful Podman)
    # ubuntu-26.04 is in public preview (no SLA) as of Sep 2026; it is the
    # only GA-track runner shipping Podman 5.x from the official distro
    # universe repo. ubuntu-24.04 (current ubuntu-latest) ships Podman 4.9.3,
    # two major versions behind the macOS dev VM (6.1.1). We accept the
    # preview caveat because the 4->5 API jump is the critical one and 5.7.0
    # is close enough to 6.1.1 for Docker-compat contract tests.
    #
    # Compatibility matrix (intentional, not exact parity):
    #   macOS dev VM : Podman 6.1.1, Fedora CoreOS 44, rootful applehv
    #   CI (here)    : Podman 5.7.0, Ubuntu 26.04,   rootful systemd socket
    # Both are modern Podman (cgroups v2, SQLite backend, Netavark/Pasta).
    # The app talks to the Docker-compatible API, not the versioned libpod
    # REST path, so the /v5.0.0 vs /v6.0.0 path split does not affect tests.
    # When ubuntu-26.04 reaches GA or Fedora 45 releases, revisit for a
    # closer match.
    #
    # Runner support reference:
    #   https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: cargo --version && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Install Podman from distro apt
        run: |
          # Install from the official Ubuntu 26.04 universe repo only.
          # No PPAs, no static bundles, no source builds, no cross-release
          # apt mixing (see podman-ci-version-choice.md for rationale).
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
      - name: Verify Podman engine version (pin 5.7.0)
        run: |
          # Log the resolved versions for traceability.
          echo "=== Podman versions ==="
          podman --version
          sudo podman --version
          echo "=== systemd ==="
          systemctl --version | head -1
          echo "=== rootful socket unit ==="
          systemctl cat podman.socket 2>/dev/null | head -5 || true

          # Pin the engine version so a silent distro upgrade cannot drift
          # the contract test surface. The expected version is the Ubuntu
          # 26.04 universe package: podman 5.7.0+ds2-3build1.
          # We assert the engine major.minor.patch is exactly 5.7.0.
          # The Debian package revision suffix (+ds2-3build1) is not pinned
          # because it can change without an engine change; the engine
          # version is the stable contract surface.
          ver=$(podman --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$ver" ]; then
            echo "::error::Could not parse Podman version from: $(podman --version)"
            exit 1
          fi
          if [ "$ver" != "5.7.0" ]; then
            echo "::error::Podman engine version mismatch: expected 5.7.0, got $ver"
            echo "::error::A silent upgrade may have drifted the CI Podman. Update the"
            echo "::error::pin in .github/workflows/ci.yml and the compatibility-matrix"
            echo "::error::comment after verifying the new version against the macOS dev VM."
            exit 1
          fi
          echo "Podman engine version $ver matches expected 5.7.0"
      - name: Start rootful Podman socket
        run: |
          sudo systemctl enable --now podman.socket
          sudo podman info --format '{{.Host.Security.Rootless}}' || true
          # Verify the rootful socket is reachable via the Docker-compatible
          # /_ping endpoint. Do NOT hardcode the versioned libpod API path
          # (/v5.0.0/libpod/...) because that path changes between Podman
          # major versions (5.x vs 6.x) and the app uses the Docker compat
          # API, not the libpod REST surface.
          if ! sudo curl -sf --unix-socket /run/podman/podman.sock \
              http://localhost/_ping >/dev/null; then
            echo "::error::rootful Podman socket did not respond to /_ping"
            exit 1
          fi
          echo "rootful Podman socket OK (Docker-compat /_ping)"
      - name: Run services contract tests
        run: |
          set -o pipefail
          # Run the ignored contract tests. Fail if any test fails or if
          # zero tests run (guards against cfg/ignore mistakes).
          # Use conditional capture with pipefail so bash -e does not abort
          # before we can print output and assert the passed-test count.
          EXIT_CODE=0
          sudo -E env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            RUST_BACKTRACE=1 \
            cargo test -p slip-core --test services_contract -- --ignored --test-threads=1 \
            2>&1 | tee /tmp/svc-contract.log || EXIT_CODE=$?
          # Preserve the original cargo exit code: if nonzero, exit
          # immediately with that status rather than falling through to
          # the zero-tests guard (which would overwrite 101 with 1).
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: contract tests exited $EXIT_CODE - see output above"
            exit "$EXIT_CODE"
          fi
          # Assert non-zero test count to prevent false-green from no tests.
          PASSED=$(grep -oP 'test result: ok\. \K\d+' /tmp/svc-contract.log | tail -1 || true)
          if [ -z "$PASSED" ] || [ "$PASSED" -eq 0 ]; then
            echo "ERROR: 0 contract tests passed - the test filter or cfg may be broken"
            exit 1
          fi
          echo "Contract tests passed: $PASSED"
          exit "$EXIT_CODE"
      - name: Cleanup
        if: always()
        run: |
          sudo podman rm -f $(sudo podman ps -a --filter "label=slip.managed=true" -q) 2>/dev/null || true
          sudo rm -rf /tmp/slip-services-test-*
