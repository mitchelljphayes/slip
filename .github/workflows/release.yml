name: Release

on:
  push:
    tags:
      - "v*"
  # Build-only dry run. Publishing is gated on a tag ref below, so a manual
  # dispatch verifies the cross builds without creating a release.
  workflow_dispatch:

jobs:
  build:
    name: Build binaries
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain-install step: cross builds inside a container that
      # provisions the toolchain from rust-toolchain.toml, along with the
      # target. Installing one on the host would be ignored — rustup applies
      # the toolchain file as an override, which is exactly how the original
      # workflow broke (it installed the musl targets for `stable` while
      # cargo resolved to the pinned version).
      #
      # To change the Rust version, edit rust-toolchain.toml.
      - uses: Swatinem/rust-cache@v2
        with:
          # `prefix` is not a valid input and was silently ignored, so both
          # matrix jobs shared one cache key and evicted each other.
          prefix-key: ${{ matrix.target }}

      # cross builds in a per-target container that carries the musl C
      # toolchain. That is required, not a convenience: libsqlite3-sys
      # (rusqlite `bundled`) compiles SQLite from C, and ring compiles C and
      # assembly, so a plain `cargo build --target *-musl` on ubuntu-latest
      # fails at link time even with the target installed.
      - uses: taiki-e/install-action@cross

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/slip-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release \
            slipd slip
          cd dist
          sha256sum slip-${{ matrix.target }}.tar.gz > slip-${{ matrix.target }}.tar.gz.sha256

      - name: Verify the binaries are static and the right architecture
        run: |
          cd target/${{ matrix.target }}/release
          file slipd slip
          # A dynamically linked binary would defeat the point of the musl
          # build and fail on hosts without a matching libc.
          for bin in slipd slip; do
            if file "$bin" | grep -q "dynamically linked"; then
              echo "::error::$bin is dynamically linked, expected static"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: slip-${{ matrix.arch }}
          path: dist/

  release:
    name: Publish release
    needs: build
    # Only publish for an actual tag. A workflow_dispatch run stops after the
    # build job, so the release path can be exercised without publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/slip-*.tar.gz
            dist/slip-*.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
