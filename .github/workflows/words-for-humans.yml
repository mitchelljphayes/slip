name: Comments

on: pull_request

permissions:
  contents: read

jobs:
  words-for-humans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.0
      - env:
          # Judgment turns on by itself once the repository has the secret.
          W4H_AI_PROVIDER: ${{ secrets.OPENROUTER_API_KEY && 'openrouter' || '' }}
          W4H_AI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          body="$RUNNER_TEMP/pr-description.md"
          jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH" > "$body"
          description=()
          if [ -s "$body" ]; then
              description=(--pr-description-file "$body")
          fi
          uvx words-for-humans==0.2.1 \
            --diff "origin/${{ github.base_ref }}...HEAD" \
            --format github ${description+"${description[@]}"}
