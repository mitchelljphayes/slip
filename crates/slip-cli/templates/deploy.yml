# slip deploy workflow — build, push, and trigger a blue-green deploy
# Generated by `slip init`. Requires:
#   - SLIP_DEPLOY_SECRET (GitHub secret, from `slip key --gh`)
#   - SLIP_DEPLOY_URL   (GitHub variable or secret, e.g. https://deploy.example.com)
#   - TS_AUTHKEY        (optional, for tailnet connectivity)
name: Deploy

on:
  push:
    branches: [main]

env:
  APP: "{NAME}"
  IMAGE: "{IMAGE}"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full=${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE }}:latest

      # ── Tailnet connectivity (optional) ──────────────────────────────────
      # If your slipd server is behind a tailnet, set TS_AUTHKEY to join.
      # The deploy webhook is then routed through the tailnet interface.
      - name: Connect to Tailscale
        if: ${{ secrets.TS_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # ── Signed deploy webhook ────────────────────────────────────────────
      # Computes HMAC-SHA256 of the JSON body and POSTs to the slipd server.
      # The server verifies the signature against the app's deploy key.
      - name: Trigger deploy
        id: deploy
        env:
          SLIP_DEPLOY_URL: ${{ vars.SLIP_DEPLOY_URL || secrets.SLIP_DEPLOY_URL }}
          SLIP_DEPLOY_SECRET: ${{ secrets.SLIP_DEPLOY_SECRET }}
        run: |
          PAYLOAD="{\"app\":\"${APP}\",\"tag\":\"${{ steps.tags.outputs.tag }}\"}"
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SLIP_DEPLOY_SECRET" | awk '{print $2}')
          RESPONSE=$(curl -sS -X POST \
            "${SLIP_DEPLOY_URL}/v1/deploy" \
            -H "Content-Type: application/json" \
            -H "X-Slip-Signature: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" \
            --insecure)
          echo "Deploy response: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.deploy_id')
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"

      # ── Wait for deploy to complete ──────────────────────────────────────
      # Polls GET /v1/deploys/{id} until the deploy reaches a terminal state.
      # This is the same contract as `slip deploy --wait` (see SLIP-98).
      #
      # Alternative: if `slip` CLI is installed in CI, replace the curl loop with:
      #   slip deploy "$APP" "${{ steps.tags.outputs.tag }}" --secret "$SLIP_DEPLOY_SECRET" --wait
      - name: Wait for deploy
        env:
          SLIP_DEPLOY_URL: ${{ vars.SLIP_DEPLOY_URL || secrets.SLIP_DEPLOY_URL }}
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          echo "Waiting for deploy ${DEPLOY_ID}..."
          for i in $(seq 1 60); do
            STATUS=$(curl -sS "${SLIP_DEPLOY_URL}/v1/deploys/${DEPLOY_ID}" --insecure | jq -r '.status // "unknown"')
            echo "  [${i}/60] status: ${STATUS}"
            case "$STATUS" in
              succeeded|completed) echo "✓ Deploy succeeded"; exit 0 ;;
              failed|rolled_back)  echo "✗ Deploy failed (status: ${STATUS})"; exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "✗ Deploy timed out after 5 minutes"
          exit 1
